name: CI / Automated Repository Screening Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test-suite:
    name: Backend Test Suite & Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Core Backend Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi
          pip install pytest pytest-asyncio pytest-cov httpx pydantic

      - name: Execute Full Pytest Suite with Coverage
        env:
          GEMINI_API_KEY: ""
          GROQ_API_KEY: ""
          OPENROUTER_API_KEY: ""
          PINATA_JWT: ""
          TWILIO_ACCOUNT_SID: ""
          TWILIO_AUTH_TOKEN: ""
        run: |
          pytest backend/tests --cov=backend/app --cov-report=xml --cov-report=term-missing

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: coverage.xml
          retention-days: 14

  code-hygiene-and-lint:
    name: Code Hygiene & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint Python Codebase
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

  frontend-build-audit:
    name: Frontend Build & Typecheck Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install --legacy-peer-deps

      - name: Audit Build & Typecheck
        working-directory: ./frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
